<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Container styling */
      .dropdown {
        position: relative;
        display: inline-block;
      }

      /* Style the button trigger */
      .dropbtn {
        color: white;
        padding: 12px 16px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        list-style: none; /* Removes the default arrow indicator */
      }

      /* Webkit browser arrow removal */
      .dropbtn::-webkit-details-marker {
        display: none;
      }

      /* Style the absolute positioned content box */
      .dropdown-content {
        position: absolute;
        background-color: #111111;
        border: gray 1px solid;
        min-width: 500px;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        z-index: 1;
      }

      /* Style individual navigation links */
      .dropdown-content a {
        color: #b7b7b7;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body style="background-color: #171717">
    <details class="dropdown">
      <summary class="dropbtn text-[16px] flex gap-1.5 items-center">
        <i class="fa-solid fa-location-dot text-red-700"></i>
        <div class="capitalize font-bold">all location</div>
        <i class="fa-solid fa-chevron-down text-[#fff]"></i>
      </summary>
      <div class="dropdown-content text-[#fff]">
        <a href="#">Link 1</a>
        <a href="#">Link 2</a>
        <a href="#">Link 3</a>
      </div>
    </details>
  </body>
</html>
