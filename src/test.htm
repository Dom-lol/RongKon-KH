<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Container styling */
      .dropdown {
        position: relative;
        display: inline-block;
      }

      /* Style the button trigger */
      .dropbtn {
        color: white;
        padding: 12px 16px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        list-style: none; /* Removes the default arrow indicator */
      }

      /* Webkit browser arrow removal */
      .dropbtn::-webkit-details-marker {
        display: none;
      }

      /* Style the absolute positioned content box */
      .dropdown-content {
        position: absolute;
        background-color: #111111;
        border: gray 1px solid;
        min-width: 500px;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        z-index: 1;
      }

      /* Style individual navigation links */
      .dropdown-content a {
        color: #b7b7b7;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
      }
    </style>
  </head>
  <body style="background-color: #171717">
    <details class="dropdown">
      <summary class="dropbtn"></summary>
      <div class="dropdown-content">
        <a href="#">Link 1</a>
        <a href="#">Link 2</a>
        <a href="#">Link 3</a>
      </div>
    </details>
  </body>
</html>
